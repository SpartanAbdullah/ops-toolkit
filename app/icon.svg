<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F3568"/>
      <stop offset="100%" stop-color="#08122A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- bolder 3/4 rotation arc — wider stroke so it survives small renders -->
  <path
    d="M 256 88 A 168 168 0 1 1 88 256"
    fill="none"
    stroke="url(#gold)"
    stroke-width="60"
    stroke-linecap="round"
  />

  <!-- origin marker at 12 o'clock — bigger -->
  <circle cx="256" cy="88" r="32" fill="white"/>

  <!-- focal center mark — large gold disc readable even at 16x16 -->
  <circle cx="256" cy="256" r="62" fill="url(#gold)"/>
  <circle cx="256" cy="256" r="22" fill="#08122A"/>
</svg>
